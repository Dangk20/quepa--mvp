<div id="root"></div>
<script>
// Red de seguridad: si algo revienta, se ve el error en pantalla en vez de un lienzo vacío.
window.addEventListener("error", function (e) {
  var r = document.getElementById("root");
  if (r && !r.firstChild) {
    r.innerHTML = '<div style="font-family:ui-monospace,monospace;padding:40px;max-width:900px;margin:60px auto;' +
      'background:#fff;border:2px solid #B4342F;border-radius:20px;color:#0A0A0A">' +
      '<div style="font-size:22px;font-weight:800;margin-bottom:14px;color:#B4342F">Se rompió algo al cargar</div>' +
      '<div style="font-size:15px;line-height:1.6;white-space:pre-wrap">' +
      String(e.message || e.error) + '</div>' +
      '<div style="font-size:13px;color:#777;margin-top:14px">' + (e.filename || "") + ':' + (e.lineno || "") + '</div></div>';
  }
});
</script>
